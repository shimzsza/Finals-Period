<html lang="en">
<head>

<title>IT218 · Human Computer Interaction 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb;--surface:#fff;--surface2:#f1f3f9;--ink:#171b2b;--muted:#636d84;--border:#e5e8f1;
  --primary:#5b4bfb;--primary2:#8b5cf6;--ok:#0e9f6e;--okbg:#e5f8f1;--bad:#e1472b;--badbg:#fdeae6;--warn:#c17a00;

  --shadow:0 1px 2px rgba(20,20,43,.04),0 8px 24px -8px rgba(20,20,43,.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e18;--surface:#131828;--surface2:#1a2036;--ink:#eef0fa;--muted:#9099b5;--border:#242b45;
  --primary:#8577ff;--primary2:#a78bfa;--ok:#34d399;--okbg:#0f2a21;--bad:#ff8a70;--badbg:#2e1712;--warn:#ffbf5c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -10px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0b0e18;--surface:#131828;--surface2:#1a2036;--ink:#eef0fa;--muted:#9099b5;--border:#242b45;
  --primary:#8577ff;--primary2:#a78bfa;--ok:#34d399;--okbg:#0f2a21;--bad:#ff8a70;--badbg:#2e1712;--warn:#ffbf5c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
svg{width:18px;height:18px;display:block}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s;animation-timing-function:cubic-bezier(.4,0,.2,1)}

header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:calc(var(--st) + 10px) 18px 10px}
.bar{display:flex;align-items:center;gap:10px;max-width:980px;margin:auto}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font-weight:800;font-size:1.02rem}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-size:.95rem;flex-shrink:0}
.brand .dim{color:var(--muted);font-weight:500}
.sp{flex:1}
.ring-wrap{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem;font-weight:600}
.ring{width:30px;height:30px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:3}
.ring-fg{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;transition:.15s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}

main{max-width:900px;margin:auto;padding:22px 18px calc(var(--sb) + 50px)}
.fade{animation:fadeUp .35s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.hero{position:relative;overflow:hidden;border-radius:24px;padding:36px 30px;margin-bottom:22px;color:#fff;
  background:radial-gradient(120% 140% at 10% 0%,#7c6bfc,#5b4bfb 45%,#4433d8 100%)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 100% 100%,rgba(255,255,255,.18),transparent)}
.hero h1{position:relative;margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;letter-spacing:-.02em}
.hero p{position:relative;margin:0;opacity:.92;max-width:52ch}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 13px;font-size:.78rem;font-weight:600}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}
.eyebrow{color:var(--primary);font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.card h2{margin:4px 0 2px;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:.92rem;margin:20px 0 8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ilist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.ilist li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.ilist svg{color:var(--primary);flex-shrink:0;margin-top:3px;width:16px;height:16px}
.box{background:var(--surface2);border-radius:14px;padding:16px 18px;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:8px;padding:4px 11px;font-size:.78rem;font-weight:600;color:var(--muted)}

.tabs{display:flex;gap:6px;margin:4px 0 16px;overflow-x:auto}
.tab{white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:.84rem;font-weight:600;color:var(--muted);transition:.15s}
.tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-theme="dark"] .tab.active,.hero~main .tab.active{}
@media(prefers-color-scheme:dark){.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}}
:root[data-theme="dark"] .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.wc{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:.18s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
.wc:hover{transform:translateY(-3px);border-color:var(--primary)}
.wc .n{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--muted);font-weight:700}
.badge{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--ok)}
.wc .t{font-weight:700;font-size:.98rem;letter-spacing:-.01em}
.wc.exam{border-left:4px solid var(--warn)}
.wc.done{border-color:var(--ok)}

.crumb{display:inline-flex;align-items:center;gap:5px;font-size:.88rem;color:var(--muted);font-weight:600;margin-bottom:14px;background:none;border:0;padding:0}
.crumb:hover{color:var(--primary)}

.qprog{display:flex;gap:6px;margin:14px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.q{border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}
.q p{margin:0 0 10px;font-weight:700;font-size:.96rem}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin:6px 0;font-size:.92rem;transition:.12s}
.opt .k{width:22px;height:22px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--muted);flex-shrink:0}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
.fb{display:flex;gap:8px;font-size:.86rem;margin-top:8px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:9px 11px}
.score{font-weight:800;margin-top:12px;font-size:1rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0;border-radius:11px;padding:11px 18px;font-weight:700;font-size:.9rem;transition:.15s;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--primary) 60%,transparent)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:none}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pager a{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;transition:.15s;box-shadow:var(--shadow)}
.pager a:hover{border-color:var(--primary);transform:translateY(-2px)}
.pager .lbl{display:flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pager .next .lbl{justify-content:flex-end}
.pager .next{text-align:right;grid-column:2}
.pager .t2{font-size:.88rem;font-weight:700}

footer{color:var(--muted);font-size:.8rem;text-align:center;padding:22px 0 10px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}.ring-wrap span{display:none}.pager{grid-template-columns:1fr}.pager .next{grid-column:1}}
</style>
</head>

{n:18,t:"Final Examination and UX Portfolio",tl:"Final na Pagsusulit at UX Portfolio",ex:"October 10 – 15, 2026",obj:["Review the full course.","Present and defend UX decisions with evidence.","Assemble a complete UX portfolio."],otl:["Balikan ang buong kurso.","Ipresenta at ipagtanggol ang mga desisyon sa UX gamit ang ebidensya.","Buuin ang kumpletong UX portfolio."],

const T={en:{back:"All weeks",weeks:"Course weeks",objectives:"Learning objectives",concepts:"Key concepts",activity:"Lab / class activity",method:"Method",quiz:"Quick check",next:"Next",prev:"Previous",done:"Mark as complete",completed:"Completed",score:"Score",retry:"Retry quiz",exam:"Examination",overview:"Course overview",outcomes:"Learning outcomes",assess:"Assessment",lessons:"done",tools:"Lab toolkit",feedback:"Explanation",all:"All",lessonsTab:"Lessons",exams:"Exams",completedTab:"Completed"},
fil:{back:"Lahat ng linggo",weeks:"Mga linggo ng kurso",objectives:"Mga layunin sa pagkatuto",concepts:"Mga pangunahing konsepto",activity:"Gawain sa lab / klase",method:"Pamamaraan",quiz:"Mabilis na pagsusuri",next:"Susunod",prev:"Nakaraan",done:"Markahang tapos",completed:"Tapos na",score:"Iskor",retry:"Ulitin",exam:"Pagsusulit",overview:"Pangkalahatang-ideya",outcomes:"Mga layunin ng kurso",assess:"Pagtatasa",lessons:"tapos",tools:"Mga tool sa lab",feedback:"Paliwanag",all:"Lahat",lessonsTab:"Aralin",exams:"Pagsusulit",completedTab:"Tapos na"}};

const OUT=["Apply advanced user-centered design principles.","Conduct user research and usability evaluations.","Design accessible, inclusive interfaces meeting international standards.","Build low- and high-fidelity prototypes for web and mobile.","Evaluate UX using quantitative and qualitative techniques.","Integrate emerging HCI technologies.","Present and defend UX decisions with evidence.","Complete a professional UX portfolio project."];
const OUT_FIL=["Ilapat ang advanced na user-centered design principles.","Magsagawa ng user research at usability evaluation.","Magdisenyo ng accessible at inclusive na interface.","Gumawa ng low- at high-fidelity prototype para sa web at mobile.","Suriin ang UX gamit ang quantitative at qualitative na paraan.","Isama ang mga umuusbong na teknolohiya sa HCI.","Ipresenta at ipagtanggol ang mga desisyon sa UX gamit ang ebidensya.","Kumpletuhin ang propesyonal na UX portfolio project."];

const KEY="it218-v3";
let S={lang:"en",done:[],quiz:{},filter:"all"};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=()=>T[S.lang];
const title=w=>S.lang==="fil"?w.tl:w.t;
const objs=w=>S.lang==="fil"?w.otl:w.obj;
const lessons=W.filter(w=>!w.ex);
const isDone=n=>S.done.includes(n);

function ring(pct){const r=12,c=2*Math.PI*r,off=c-(pct/100)*c;
  return `<svg class="ring" viewBox="0 0 30 30"><circle cx="15" cy="15" r="${r}" class="ring-bg"/><circle cx="15" cy="15" r="${r}" class="ring-fg" style="stroke-dasharray:${c};stroke-dashoffset:${off}"/></svg>`;}

function updateHeader(){
  const pct=Math.round(S.done.filter(n=>!W[n-1].ex).length/lessons.length*100);
  document.getElementById("ringWrap").innerHTML=`${ring(pct)}<span>${pct}%</span>`;
  document.getElementById("lang").innerHTML=ICON.globe;
  const dark=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.getElementById("theme").innerHTML=dark?ICON.sun:ICON.moon;
}

function home(){
  const tools=["Figma","Adobe XD","Balsamiq","Miro","Maze","Google Forms","VS Code","HTML/CSS/JS","React","Lighthouse","WAVE","AI design assistants","Unity (optional)"];
  const f=S.filter;
  const list=W.filter(w=>f==="all"?true:f==="exam"?w.ex:f==="done"?isDone(w.n):!w.ex);
  return `
  <section class="hero fade"><h1>Human Computer Interaction 2</h1>
    <p>${S.lang==="fil"?"Magdisenyo, bumuo, at suriin ang mga interactive na sistema gamit ang user-centered design.":"Design, build, and evaluate interactive systems using user-centered design principles."}</p>
    <div class="chips"><span class="chip">3 Units</span><span class="chip">18 Weeks</span><span class="chip">2h Lecture + 3h Lab</span><span class="chip">Blended</span><span class="chip">Prereq: IT218</span></div></section>
  <section class="card fade"><div class="eyebrow">${L().overview}</div>
    <h2>${L().outcomes}</h2>
    <ul class="ilist">${(S.lang==="fil"?OUT_FIL:OUT).map(x=>`<li>${ICON.check}<span>${esc(x)}</span></li>`).join("")}</ul>
    <div class="grid2" style="margin-top:16px">
      <div class="box"><h3 style="margin-top:0">${L().assess}</h3><ul class="ilist"><li>${ICON.dot}Quizzes: 30%</li><li>${ICON.dot}Class standing: 30%</li><li>${ICON.dot}Major examination: 40%</li></ul></div>
      <div class="box"><h3 style="margin-top:0">${L().tools}</h3><p style="margin:0;font-size:.9rem">${tools.join(" · ")}</p></div>
    </div></section>
  <h2 style="margin:4px 0 2px;font-size:1.15rem">${L().weeks}</h2>
  <div class="tabs">
    <button class="tab ${f==='all'?'active':''}" onclick="setFilter('all')">${L().all}</button>
    <button class="tab ${f==='lesson'?'active':''}" onclick="setFilter('lesson')">${L().lessonsTab}</button>
    <button class="tab ${f==='exam'?'active':''}" onclick="setFilter('exam')">${L().exams}</button>
    <button class="tab ${f==='done'?'active':''}" onclick="setFilter('done')">${L().completedTab}</button>
  </div>
  <div class="weeks fade">${list.map(w=>`
    <button class="wc ${w.ex?'exam':''} ${isDone(w.n)?'done':''}" onclick="go(${w.n})">
      <div class="n"><span>${w.ex?L().exam:"Week "+w.n}</span>${isDone(w.n)?`<span class="badge">${ICON.check}</span>`:""}</div>
      <div class="t">${esc(title(w))}</div>
      ${w.ex?`<span class="tag">${esc(w.ex)}</span>`:""}
    </button>`).join("")}</div>
  <footer>Prepared by Dr. Caniedo · Updated September 2026</footer>`;
}

function setFilter(f){S.filter=f;save();render();}

function quizBlock(w){
  const st=S.quiz[w.n]||{answers:{},passed:false};
  const dots=w.q.map((q,i)=>{const p=st.answers[i];const cls=p===undefined?"":p===q.a?"ok":"bad";return `<span class="dot ${cls}"></span>`;}).join("");
  const qs=w.q.map((q,i)=>{
    const picked=st.answers[i],answered=picked!==undefined,letters=["A","B","C","D"];
    return `<div class="q"><p>${i+1}. ${esc(q.q)}</p>
      ${q.o.map((o,j)=>{let cls="";if(answered){if(j===q.a)cls="right";else if(j===picked)cls="wrong";}
        return `<button class="opt ${cls}" ${answered?"disabled":""} onclick="answer(${w.n},${i},${j})"><span class="k">${letters[j]}</span>${esc(o)}</button>`;}).join("")}
      ${answered?`<div class="fb">${ICON.check}<span><b>${L().feedback}:</b> ${esc(q.e)}</span></div>`:""}
    </div>`;}).join("");
  const allAnswered=Object.keys(st.answers).length===w.q.length;
  const score=Object.keys(st.answers).filter(i=>st.answers[i]===w.q[i].a).length;
  return `<h3>${L().quiz}</h3><div class="qprog">${dots}</div>${qs}
    ${allAnswered?`<div class="score">${L().score}: ${score}/${w.q.length}${score===w.q.length?" 🎉":""}</div>
    <div class="row"><button class="btn ghost" onclick="retry(${w.n})">${L().retry}</button></div>`:""}`;
}

function answer(n,i,j){
  const w=W[n-1],st=S.quiz[n]||(S.quiz[n]={answers:{},passed:false});
  if(st.answers[i]!==undefined)return;
  st.answers[i]=j;
  if(Object.keys(st.answers).length===w.q.length){const sc=Object.keys(st.answers).filter(k=>st.answers[k]===w.q[k].a).length;st.passed=sc>=Math.ceil(w.q.length*0.5);}
  save();render();
}
function retry(n){S.quiz[n]={answers:{},passed:false};save();render();}

function lesson(n){
  const w=W[n-1],prev=W[n-2],next=W[n];
  const list=a=>`<ul class="ilist">${a.map(x=>`<li>${ICON.check}<span>${esc(x)}</span></li>`).join("")}</ul>`;
  return `
  <button class="crumb" onclick="go(0)">${ICON.l}${L().back}</button>
  <section class="card fade">
    <div class="eyebrow">${w.ex?L().exam:"Week "+w.n}${w.ex?" · "+esc(w.ex):""}</div>
    <h2>${esc(title(w))}</h2>
    <div style="margin:8px 0"><span class="tag">${L().method}: ${esc(w.m)}</span></div>
    <h3>${L().objectives}</h3>${list(objs(w))}
    <h3>${L().concepts}</h3>${list(w.c)}
    <h3>${L().activity}</h3><div class="box">${esc(w.act)}</div>
    ${w.ex?"":quizBlock(w)}
    ${w.ex?"":`<div class="row"><button class="btn ${isDone(n)?'ghost':'ok'}" onclick="toggleDone(${n})">${ICON.check}${isDone(n)?L().completed:L().done}</button></div>`}
  </section>
  <div class="pager fade">
    ${prev?`<a class="prev" href="#/week/${prev.n}"><span class="lbl">${ICON.l}${L().prev}</span><span class="t2">${esc(title(prev))}</span></a>`:"<span></span>"}
    ${next?`<a class="next" href="#/week/${next.n}"><span class="lbl">${L().next}${ICON.r}</span><span class="t2">${esc(title(next))}</span></a>`:"<span></span>"}
  </div>`;
}

function toggleDone(n){S.done=isDone(n)?S.done.filter(x=>x!==n):[...S.done,n];save();render();}

function doRender(resetScroll){
  const h=location.hash.match(/#\/week\/(\d+)/);
  document.getElementById("app").innerHTML = h && W[+h[1]-1] ? lesson(+h[1]) : home();
  document.documentElement.lang = S.lang==="fil"?"fil":"en";
  updateHeader();
  if(resetScroll) window.scrollTo({top:0,behavior:"instant"});
}
function render(nav){
  if(nav && document.startViewTransition){ document.startViewTransition(()=>doRender(true)); }
  else { doRender(!!nav); }
}

function go(n){ location.hash = n? `#/week/${n}` : "#/"; }

document.getElementById("home").onclick=()=>go(0);
document.getElementById("lang").onclick=()=>{S.lang=S.lang==="en"?"fil":"en";save();render();};
document.getElementById("theme").onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme=dark?"light":"dark";
  updateHeader();
};
window.addEventListener("hashchange",()=>render(true));
render(true);
</script>
</body>
</html>
